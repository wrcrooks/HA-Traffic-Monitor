---
name: "Traffic Monitor"
version: "0.4.0"
slug: "traffic_monitor"
description: "Monitor drive time and live traffic for routes you define, with a map UI for picking among alternatives."
url: "https://github.com/wrcrooks/HA-Traffic-Monitor"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:traffic-light
panel_title: "Traffic Monitor"
services:
  - mqtt:want
map:
  - type: addon_config
    read_only: false
options:
  api_key: ""
  unit_system: "metric"
  log_level: "info"
  # Routes are managed via the /api/routes API (persisted in
  # /data/routes.json) from M3 onward, not through these options -- see
  # ROADMAP.md. These remain only as a one-time convenience: if set on
  # first boot (and routes.json is still empty), they're migrated into a
  # real route automatically so an M2 install doesn't lose its route on
  # upgrade. Safe to leave blank.
  route_name: "My Commute"
  route_avoid_tolls: false
  route_poll_interval_minutes: 15
schema:
  api_key: "password"
  unit_system: "list(metric|imperial)"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  # Optional manual MQTT override -- normally auto-discovered via the
  # mqtt:want service below; only needed if that discovery doesn't apply.
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  route_name: "str"
  route_origin: "str?"
  route_destination: "str?"
  route_avoid_tolls: "bool"
  route_poll_interval_minutes: "int(1,1440)"
