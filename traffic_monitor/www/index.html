<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Traffic Monitor</title>
  <!-- Relative paths only, no leading slash -- see js/api.js for why.
       "static/" prefix because main.py mounts StaticFiles at /static;
       the API routes and this page itself stay unprefixed. -->
  <link rel="stylesheet" href="static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="container">
    <h1>Traffic Monitor</h1>
    <div id="config-banner" class="config-banner" hidden></div>
    <div id="usage-bar" class="usage-bar" hidden>
      <div class="usage-track"><div id="usage-fill" class="usage-fill"></div></div>
      <span id="usage-label" class="usage-label"></span>
    </div>

    <!-- Route list view -->
    <section id="view-list">
      <div class="list-header">
        <span class="muted" id="route-count-label"></span>
        <button id="btn-add-route" class="btn-primary">+ Add Route</button>
      </div>
      <div id="route-list" class="route-list"></div>
      <div id="empty-state" class="empty-state" hidden>
        No routes yet. Add one to start monitoring drive time and traffic.
      </div>
    </section>

    <!-- Add/edit route view -->
    <section id="view-editor" hidden>
      <div class="editor-header">
        <h2 id="editor-title" style="margin:0;font-size:16px;">Add Route</h2>
        <button id="btn-cancel-editor" class="btn-icon" title="Back to list">&times;</button>
      </div>

      <form id="route-form">
        <div class="form-row">
          <label for="field-name">Name</label>
          <input type="text" id="field-name" placeholder="e.g. Morning Commute" required>
        </div>
        <div class="form-row">
          <label for="field-origin">Origin address</label>
          <input type="text" id="field-origin" placeholder="123 Main St, Anytown" required>
        </div>
        <div class="form-row">
          <label for="field-destination">Destination address</label>
          <input type="text" id="field-destination" placeholder="456 Oak Ave, Anytown" required>
        </div>
        <div class="form-row checkbox-row">
          <input type="checkbox" id="field-avoid-tolls">
          <label for="field-avoid-tolls" style="margin:0;">Avoid toll roads</label>
        </div>
        <div class="form-row">
          <label for="field-poll-interval">Poll interval (minutes)</label>
          <input type="number" id="field-poll-interval" min="1" max="1440" value="15">
        </div>
        <div class="form-row checkbox-row">
          <input type="checkbox" id="field-enabled" checked>
          <label for="field-enabled" style="margin:0;">Enabled</label>
        </div>

        <div class="form-row">
          <label>Active on</label>
          <div id="schedule-days" class="schedule-days"></div>
        </div>
        <div class="form-row">
          <label>Active time windows (leave empty to poll all day)</label>
          <div id="schedule-windows" class="schedule-windows"></div>
          <button type="button" id="btn-add-window" class="btn-secondary">+ Add time window</button>
          <p class="schedule-hint">
            A route is only polled inside its active windows -- this is what lets many routes
            fit inside TomTom's free monthly quota. No windows means always active.
          </p>
        </div>

        <div class="preview-section">
          <button type="button" id="btn-preview" class="btn-secondary">Preview route</button>
          <div id="preview-error" class="preview-error" hidden></div>
          <div id="preview-map"></div>
          <div id="alternatives-list" class="alternatives-list"></div>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">Save route</button>
          <button type="button" id="btn-delete-in-editor" class="btn-secondary btn-danger" hidden>Delete route</button>
        </div>
      </form>
    </section>
  </div>

  <script src="static/vendor/leaflet/leaflet.js"></script>
  <script src="static/js/api.js"></script>
  <script src="static/js/map.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
