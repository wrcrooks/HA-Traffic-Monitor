<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Traffic Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --card: #ffffff;
      --border: #e2e2e5;
      --accent: #0a7cff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --fg: #f2f2f2;
        --muted: #9a9a9e;
        --card: #1f2023;
        --border: #2c2d30;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-inline: 16px;
      padding-block: 24px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.subtitle { color: var(--muted); margin: 0 0 20px; }
    dl { margin: 0; }
    dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; margin-top: 12px; }
    dd { margin: 2px 0 0; font-size: 14px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill.ok { background: #d7f5df; color: #146c2e; }
    .pill.warn { background: #fdecc8; color: #8a5a00; }
    @media (prefers-color-scheme: dark) {
      .pill.ok { background: #123a20; color: #6fe39a; }
      .pill.warn { background: #3a2c0c; color: #f0c064; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Traffic Monitor</h1>
    <p class="subtitle">Milestone M0 &mdash; scaffold running. Route configuration and the map UI land in later milestones.</p>
    <dl id="fields"></dl>
  </div>
  <script>
    fetch('api/status')
      .then(r => r.json())
      .then(data => {
        const dl = document.getElementById('fields');
        const rows = [
          ['Status', data.status],
          ['Version', data.version],
          ['TomTom API key', data.api_key_configured
            ? '<span class="pill ok">configured</span>'
            : '<span class="pill warn">not set</span>'],
          ['MQTT', data.mqtt_configured
            ? '<span class="pill ok">detected</span>'
            : '<span class="pill warn">not detected</span>'],
          ['Unit system', data.unit_system],
        ];
        dl.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
      })
      .catch(() => {
        document.getElementById('fields').innerHTML = '<dt>Status</dt><dd><span class="pill warn">API unreachable</span></dd>';
      });
  </script>
</body>
</html>
